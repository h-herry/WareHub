# H2 演示模式配置（零安装体验）
spring:
  datasource:
    url: jdbc:h2:mem:warehub;MODE=MYSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

# 演示模式下关闭 SQL 日志
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    root: WARN
    com.warehub: INFO

# WareHub 业务配置（H2 演示模式）
warehub:
  # CORS 白名单（逗号分隔），缺失时回退到仅 http://localhost:8080
  cors:
    allowed-origins: "http://localhost:8080,http://localhost:5173"
  # JWT 配置
  jwt:
    secret: ${JWT_SECRET}
